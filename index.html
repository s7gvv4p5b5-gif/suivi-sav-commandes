<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi SAV & Commandes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1a1d23; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-ink:#ffffff;
  --green:#16a34a; --greenbg:#e9f9ef;
  --orange:#d97706; --orangebg:#fff4e5;
  --red:#dc2626; --redbg:#fde8e8;
  --grey:#9ca3af; --greybg:#f1f2f4;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1e2127; --ink:#eef0f3; --sub:#9aa1ac; --line:#2c313a;
    --greenbg:#0f2a1a; --orangebg:#332208; --redbg:#3a1414; --greybg:#25282f;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1e2127; --ink:#eef0f3; --sub:#9aa1ac; --line:#2c313a;
  --greenbg:#0f2a1a; --orangebg:#332208; --redbg:#3a1414; --greybg:#25282f;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
h1{font-size:18px;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto}
.tab{padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;border:1px solid transparent}
.tab.active{background:var(--accent);color:var(--accent-ink)}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-green{background:var(--greenbg);color:var(--green)}
.b-orange{background:var(--orangebg);color:var(--orange)}
.b-red{background:var(--redbg);color:var(--red)}
.b-grey{background:var(--greybg);color:var(--grey)}
.dossier{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;background:var(--card)}
.dossier:active{opacity:.85}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.d-name{font-weight:700;font-size:14.5px}
.d-sub{color:var(--sub);font-size:12.5px;margin-top:2px}
.d-meta{margin-top:6px;font-size:12.5px;color:var(--sub)}
.d-meta b{color:var(--ink)}
input,select,textarea{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14.5px;font-family:inherit}
label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin:9px 0 3px}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer}
.btn.sec{background:var(--greybg);color:var(--ink)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.block{width:100%}
.row{display:flex;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:25}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:17px}
.close{float:right;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters select,.filters input{width:auto;min-width:110px;font-size:12.5px;padding:6px 9px}
.searchbar{margin-bottom:10px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:13.5px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--greybg);color:var(--ink);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.pill button{border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;display:none}
.small{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <div class="head-row">
    <h1>🎿 Suivi SAV & Commandes</h1>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="dash">Tableau de bord</div>
    <div class="tab" data-tab="sav">SAV</div>
    <div class="tab" data-tab="cmd">Commandes</div>
    <div class="tab" data-tab="clients">Clients</div>
    <div class="tab" data-tab="reglages">Réglages</div>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" title="Nouveau dossier">+</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwV4XhsQXOMLtkGcl1wNC6__f-jaTo2LM",
  authDomain: "suivi-sav-d44c2.firebaseapp.com",
  projectId: "suivi-sav-d44c2",
  storageBucket: "suivi-sav-d44c2.firebasestorage.app",
  messagingSenderId: "239365712544",
  appId: "1:239365712544:web:3e97a6b8654add538477c5"
};
const fbApp = initializeApp(firebaseConfig);
const dbFs = getFirestore(fbApp);
const dossiersCol = collection(dbFs,'dossiers');
const employesCol = collection(dbFs,'employes');

const SAV_STATUTS=["Ouvert","Envoyé au fournisseur","En attente fournisseur","Pièce reçue","Prêt pour retrait","Terminé"];
const CMD_STATUTS=["Commandée","Envoyée au fournisseur","En attente fournisseur","Expédiée","Reçue en magasin","Livrée au client","Annulée"];
const CLOSED=new Set(["Terminé","Livrée au client","Annulée"]);
let dossiers=[], employes=[];
let state={tab:'dash', filters:{}, search:''};
let empSeeded=false;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2200);}
function uid(){return Math.random().toString(36).slice(2,9);}
function fmtDate(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmtDateTime(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}

function urgency(d){
  if(d.cloture||CLOSED.has(d.statut)) return {level:'grey',label:'Terminé',icon:'⚪'};
  if(!d.prochaineDate) return {level:'green',label:'À jour',icon:'🟢'};
  const diffH=(new Date(d.prochaineDate)-new Date())/3600000;
  if(diffH<0) return {level:'red',label:'En retard',icon:'⚠️'};
  if(diffH<=24) return {level:'red',label:'À vérifier aujourd\'hui',icon:'🔴'};
  if(diffH<=72) return {level:'orange',label:'À vérifier prochainement',icon:'🟠'};
  return {level:'green',label:'À jour',icon:'🟢'};
}
function badge(u){return `<span class="badge b-${u.level}">${u.icon} ${u.label}</span>`;}

function initDb(){
  onSnapshot(dossiersCol, snap=>{
    dossiers = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, e=>{ console.error(e); toast('Erreur de connexion à la base'); });
  onSnapshot(employesCol, async snap=>{
    employes = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!empSeeded && employes.length===0){
      empSeeded=true;
      for(const nom of ['Tim','Denis','Tony','Adrien','Sofia','Maël','Jey','Nico','Théo']){
        await addDoc(employesCol, {nom});
      }
    }
    render();
  }, e=>console.error(e));
  render();
}

async function saveDossier(data, id){
  if(id){ await updateDoc(doc(dbFs,'dossiers',id), data); }
  else { await addDoc(dossiersCol, data); }
}
async function deleteDossier(id){
  await deleteDoc(doc(dbFs,'dossiers',id));
}

// ---------- Rendering ----------
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  const main=document.getElementById('main');
  if(state.tab==='dash') main.innerHTML=renderDash();
  else if(state.tab==='sav') main.innerHTML=renderList('sav');
  else if(state.tab==='cmd') main.innerHTML=renderList('commande');
  else if(state.tab==='clients') main.innerHTML=renderClients();
  else if(state.tab==='reglages') main.innerHTML=renderReglages();
  bindDynamic();
}

function renderDash(){
  const open=dossiers.filter(d=>!d.cloture && !CLOSED.has(d.statut));
  const today=open.filter(d=>{const u=urgency(d);return u.level==='red';});
  const late=open.filter(d=>d.prochaineDate && new Date(d.prochaineDate)<new Date());
  const soon=open.filter(d=>{const u=urgency(d);return u.level==='orange';});
  const sav=dossiers.filter(d=>d.type==='sav');
  const cmd=dossiers.filter(d=>d.type==='commande');
  const attentionList=[...late,...today].sort((a,b)=>new Date(a.prochaineDate)-new Date(b.prochaineDate));
  return `
  <div class="card">
    <div style="font-weight:700;font-size:15px;margin-bottom:2px">👋 Voici les dossiers à traiter aujourd'hui</div>
    <div class="small">${attentionList.length} dossier(s) nécessitent une action</div>
  </div>
  <div class="grid4">
    <div class="stat"><b>${cmd.filter(d=>!CLOSED.has(d.statut)).length}</b><span>Commandes en cours</span></div>
    <div class="stat" style="color:var(--red)"><b>${late.length}</b><span>En retard</span></div>
    <div class="stat" style="color:var(--orange)"><b>${soon.length}</b><span>À vérifier bientôt</span></div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Dossiers prioritaires</div>
    ${attentionList.length? attentionList.map(d=>dossierRow(d)).join('') : '<div class="empty">Rien à signaler 🎉</div>'}
  </div>`;
}

function matchesFilters(d){
  const f=state.filters;
  if(f.type && d.type!==f.type) return false;
  if(f.statut && d.statut!==f.statut) return false;
  if(f.employe && d.employe!==f.employe) return false;
  if(f.fournisseur && !(d.fournisseur||'').toLowerCase().includes(f.fournisseur.toLowerCase())) return false;
  if(f.late){ const u=urgency(d); if(u.level!=='red') return false; }
  if(state.search){
    const s=state.search.toLowerCase();
    const hay=[d.nom,d.prenom,d.telephone,d.email,d.reference,d.produit].join(' ').toLowerCase();
    if(!hay.includes(s)) return false;
  }
  return true;
}

function renderList(type){
  const statuts = type==='sav'?SAV_STATUTS:CMD_STATUTS;
  const list = dossiers.filter(d=>d.type===type).filter(matchesFilters)
    .sort((a,b)=>(a.prochaineDate||'9999').localeCompare(b.prochaineDate||'9999'));
  return `
  <input class="searchbar" id="searchInput" placeholder="🔍 Rechercher nom, téléphone, email, référence..." value="${state.search||''}">
  <div class="filters">
    <select id="fStatut"><option value="">Tous statuts</option>${statuts.map(s=>`<option ${state.filters.statut===s?'selected':''}>${s}</option>`).join('')}</select>
    <select id="fEmploye"><option value="">Tout employé</option>${employes.map(e=>`<option ${state.filters.employe===e.nom?'selected':''}>${e.nom}</option>`).join('')}</select>
    <input id="fFournisseur" placeholder="Fournisseur" value="${state.filters.fournisseur||''}">
    <select id="fLate"><option value="">Tous</option><option value="1" ${state.filters.late?'selected':''}>En retard uniquement</option></select>
  </div>
  ${list.length? list.map(d=>dossierRow(d)).join('') : '<div class="empty">Aucun dossier</div>'}
  `;
}

function dossierRow(d){
  const u=urgency(d);
  return `<div class="dossier" data-open="${d.id}">
    <div class="d-top">
      <div>
        <div class="d-name">${d.prenom||''} ${d.nom||''} — ${d.produit||''}</div>
        <div class="d-sub">${d.type==='sav'?'SAV':'Commande'} · ${d.fournisseur||'—'} · ${d.employe||'—'}</div>
      </div>
      ${badge(u)}
    </div>
    <div class="d-meta"><b>${d.statut}</b> · Dernière action : ${d.derniereAction||'—'} (${fmtDate(d.dateDerniereAction)})</div>
    <div class="d-meta">Prochain suivi : ${d.prochaineDate? fmtDateTime(d.prochaineDate):'—'}</div>
  </div>`;
}

function renderClients(){
  const map={};
  dossiers.forEach(d=>{
    const key=(d.telephone||d.email||d.nom+d.prenom).toLowerCase();
    if(!map[key]) map[key]={nom:d.nom,prenom:d.prenom,telephone:d.telephone,email:d.email,list:[]};
    map[key].list.push(d);
  });
  let clients=Object.values(map);
  if(state.search){
    const s=state.search.toLowerCase();
    clients=clients.filter(c=>[c.nom,c.prenom,c.telephone,c.email].join(' ').toLowerCase().includes(s));
  }
  return `
  <input class="searchbar" id="searchInput" placeholder="🔍 Rechercher un client..." value="${state.search||''}">
  ${clients.length? clients.map(c=>`
    <div class="card">
      <div style="font-weight:700">${c.prenom||''} ${c.nom||''}</div>
      <div class="small">${c.telephone||''} ${c.email?'· '+c.email:''}</div>
      <div style="margin-top:8px">${c.list.map(d=>dossierRow(d)).join('')}</div>
    </div>`).join('') : '<div class="empty">Aucun client</div>'}
  `;
}

function renderReglages(){
  return `
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">👥 Employés</div>
    <div class="pill-row">${employes.map(e=>`<span class="pill">${e.nom}<button data-delemp="${e.id}">✕</button></span>`).join('')}</div>
    <div class="row" style="margin-top:10px">
      <input id="newEmpName" placeholder="Nom de l'employé">
      <button class="btn" id="addEmpBtn">Ajouter</button>
    </div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">📥 Importer un fichier Excel</div>
    <div class="small" style="margin-bottom:8px">Colonnes reconnues automatiquement : Nom, Prénom, Téléphone, Email, Produit, Référence, Fournisseur, Statut, Commentaires...</div>
    <select id="importType"><option value="sav">Importer comme SAV</option><option value="commande">Importer comme Commande</option></select>
    <input style="margin-top:8px" type="file" id="importFile" accept=".xlsx,.xls,.csv">
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">💾 Sauvegarde</div>
    <div class="small" style="margin-bottom:8px">Les données sont enregistrées automatiquement dans ce navigateur, sur cet ordinateur uniquement. Exportez régulièrement une copie de secours en Excel (et gardez le fichier .html en lieu sûr).</div>
    <button class="btn block sec" id="exportBtn">Exporter toutes les données (.xlsx)</button>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">🔔 Notifications</div>
    <div class="small" style="margin-bottom:8px">Activez les notifications du navigateur pour être alerté des dossiers en retard pendant que le programme est ouvert.</div>
    <button class="btn block sec" id="notifBtn">Activer les notifications navigateur</button>
  </div>`;
}

// ---------- Form (create/edit) ----------
function openForm(type, existing){
  const isSav = type==='sav';
  const statuts = isSav?SAV_STATUTS:CMD_STATUTS;
  const d = existing || {type, statut:statuts[0], dateDepot:new Date().toISOString().slice(0,10), dateCommande:new Date().toISOString().slice(0,10)};
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="sheet">
    <span class="close" data-close>×</span>
    <h2>${existing? (isSav?'SAV':'Commande')+' — '+(d.prenom||'')+' '+(d.nom||'') : 'Nouveau '+(isSav?'SAV':'commande')}</h2>
    <label>Nom</label><input id="f_nom" value="${d.nom||''}">
    <label>Prénom</label><input id="f_prenom" value="${d.prenom||''}">
    <div class="row"><div style="flex:1"><label>Téléphone</label><input id="f_tel" value="${d.telephone||''}"></div>
    <div style="flex:1"><label>Email</label><input id="f_email" value="${d.email||''}"></div></div>
    <label>Produit / modèle</label><input id="f_produit" value="${d.produit||''}">
    <label>${isSav?'N° commande / référence':'Référence'}</label><input id="f_ref" value="${d.reference||''}">
    <label>Fournisseur / fabricant</label><input id="f_fourn" value="${d.fournisseur||''}">
    ${isSav?`<label>Date de dépôt</label><input type="date" id="f_datedepot" value="${d.dateDepot||''}">
    <label>Description du problème</label><textarea id="f_desc" rows="2">${d.description||''}</textarea>`
    :`<label>Date de commande</label><input type="date" id="f_datecmd" value="${d.dateCommande||''}">
    <label>Date de livraison prévue</label><input type="date" id="f_datelivr" value="${d.dateLivraisonPrevue||''}">`}
    <label>Statut</label><select id="f_statut">${statuts.map(s=>`<option ${d.statut===s?'selected':''}>${s}</option>`).join('')}</select>
    <label>Employé responsable</label><select id="f_emp"><option value="">—</option>${employes.map(e=>`<option ${d.employe===e.nom?'selected':''}>${e.nom}</option>`).join('')}</select>
    <label>Dernière action effectuée</label><input id="f_action" value="${d.derniereAction||''}" placeholder="ex: Demande envoyée au fournisseur">
    <label>Prochain rappel</label>
    <select id="f_delai">
      <option value="24">Dans 24 h</option>
      <option value="48" selected>Dans 48 h</option>
      <option value="72">Dans 72 h</option>
      <option value="168">Dans 7 jours</option>
      <option value="0">Pas de rappel (clôturé)</option>
    </select>
    <label>Commentaires</label><textarea id="f_com" rows="2">${d.commentaires||''}</textarea>
    <div class="row" style="margin-top:14px">
      ${existing?'<button class="btn danger" id="f_del">Supprimer</button>':''}
      <button class="btn block" id="f_save">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-close]').onclick=()=>ov.remove();
  ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  ov.querySelector('#f_save').onclick=async()=>{
    const delai=parseInt(ov.querySelector('#f_delai').value,10);
    const statut=ov.querySelector('#f_statut').value;
    const cloture = CLOSED.has(statut) || delai===0;
    const data={
      type, nom:ov.querySelector('#f_nom').value, prenom:ov.querySelector('#f_prenom').value,
      telephone:ov.querySelector('#f_tel').value, email:ov.querySelector('#f_email').value,
      produit:ov.querySelector('#f_produit').value, reference:ov.querySelector('#f_ref').value,
      fournisseur:ov.querySelector('#f_fourn').value, statut,
      employe:ov.querySelector('#f_emp').value,
      derniereAction:ov.querySelector('#f_action').value,
      dateDerniereAction:new Date().toISOString(),
      commentaires:ov.querySelector('#f_com').value,
      cloture,
      prochaineDate: cloture? null : new Date(Date.now()+delai*3600000).toISOString(),
    };
    if(isSav){ data.dateDepot=ov.querySelector('#f_datedepot').value; data.description=ov.querySelector('#f_desc').value; }
    else { data.dateCommande=ov.querySelector('#f_datecmd').value; data.dateLivraisonPrevue=ov.querySelector('#f_datelivr').value; }
    if(!existing) data.createdAt=new Date().toISOString();
    await saveDossier(data, existing?existing.id:null);
    toast('Dossier enregistré');
    ov.remove();
  };
  if(existing){
    ov.querySelector('#f_del').onclick=async()=>{
      if(confirm('Supprimer ce dossier ?')){ await deleteDossier(existing.id); ov.remove(); toast('Dossier supprimé'); }
    };
  }
}

function bindDynamic(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick=()=>{const d=dossiers.find(x=>x.id===el.dataset.open); if(d) openForm(d.type,d);};
  });
  const si=document.getElementById('searchInput');
  if(si){ si.oninput=()=>{state.search=si.value; render(); setTimeout(()=>{const s=document.getElementById('searchInput'); if(s){s.focus(); s.selectionStart=s.selectionEnd=s.value.length;}},0);}; }
  const fS=document.getElementById('fStatut'); if(fS) fS.onchange=()=>{state.filters.statut=fS.value; render();};
  const fE=document.getElementById('fEmploye'); if(fE) fE.onchange=()=>{state.filters.employe=fE.value; render();};
  const fF=document.getElementById('fFournisseur'); if(fF) fF.oninput=()=>{state.filters.fournisseur=fF.value; render();};
  const fL=document.getElementById('fLate'); if(fL) fL.onchange=()=>{state.filters.late=fL.value==='1'; render();};
  const addEmp=document.getElementById('addEmpBtn');
  if(addEmp) addEmp.onclick=async()=>{
    const v=document.getElementById('newEmpName').value.trim();
    if(v){ await addDoc(employesCol, {nom:v}); toast('Employé ajouté'); }
  };
  document.querySelectorAll('[data-delemp]').forEach(b=>{
    b.onclick=async()=>{ await deleteDoc(doc(dbFs,'employes',b.dataset.delemp)); };
  });
  const impFile=document.getElementById('importFile');
  if(impFile) impFile.onchange=(e)=>handleImport(e.target.files[0], document.getElementById('importType').value);
  const expBtn=document.getElementById('exportBtn');
  if(expBtn) expBtn.onclick=doExport;
  const notifBtn=document.getElementById('notifBtn');
  if(notifBtn) notifBtn.onclick=()=>{
    if(!('Notification' in window)){toast('Non supporté par ce navigateur');return;}
    Notification.requestPermission().then(p=>{ if(p==='granted'){toast('Notifications activées'); checkNotify();} });
  };
}

function findCol(headers, names){
  for(const n of names){
    const idx=headers.findIndex(h=>h && h.toString().trim().toLowerCase()===n);
    if(idx>=0) return idx;
  }
  return -1;
}
async function handleImport(file, type){
  if(!file) return;
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
  if(!rows.length){toast('Fichier vide');return;}
  const headers=rows[0];
  const col={
    nom:findCol(headers,['nom']), prenom:findCol(headers,['prénom','prenom']),
    tel:findCol(headers,['téléphone','telephone','tel']), email:findCol(headers,['email','e-mail']),
    produit:findCol(headers,['produit','modèle','modele']), ref:findCol(headers,['référence','reference','ref','n° commande']),
    fourn:findCol(headers,['fournisseur','fabricant']), statut:findCol(headers,['statut']),
    com:findCol(headers,['commentaires','commentaire'])
  };
  let count=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const get=(idx)=>idx>=0? (r[idx]!==undefined? String(r[idx]):'') : '';
    const data={
      type, nom:get(col.nom), prenom:get(col.prenom), telephone:get(col.tel), email:get(col.email),
      produit:get(col.produit), reference:get(col.ref), fournisseur:get(col.fourn),
      statut: get(col.statut) || (type==='sav'?SAV_STATUTS[0]:CMD_STATUTS[0]),
      commentaires:get(col.com), employe:'', derniereAction:'Importé depuis Excel',
      dateDerniereAction:new Date().toISOString(), cloture:false,
      prochaineDate:new Date(Date.now()+48*3600000).toISOString(), createdAt:new Date().toISOString(),
    };
    if(type==='sav') data.dateDepot=new Date().toISOString().slice(0,10);
    else data.dateCommande=new Date().toISOString().slice(0,10);
    await addDoc(dossiersCol, data);
    count++;
  }
  toast(`${count} dossier(s) importé(s)`);
}

function doExport(){
  const rows=dossiers.map(d=>({
    Type:d.type==='sav'?'SAV':'Commande', Nom:d.nom, Prénom:d.prenom, Téléphone:d.telephone, Email:d.email,
    Produit:d.produit, Référence:d.reference, Fournisseur:d.fournisseur, Statut:d.statut,
    'Dernière action':d.derniereAction, 'Date dernière action':d.dateDerniereAction, 'Prochain suivi':d.prochaineDate,
    Commentaires:d.commentaires, Employé:d.employe
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Dossiers');
  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const blob=new Blob([out],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='export-sav-commandes.xlsx'; a.click();
  URL.revokeObjectURL(url);
}

function checkNotify(){
  if(Notification.permission!=='granted') return;
  const late=dossiers.filter(d=>!d.cloture && !CLOSED.has(d.statut) && d.prochaineDate && new Date(d.prochaineDate)<new Date());
  if(late.length){ new Notification('Suivi SAV & Commandes', {body:`${late.length} dossier(s) en retard à vérifier`}); }
}

document.getElementById('tabs').addEventListener('click',(e)=>{
  const t=e.target.closest('.tab'); if(!t) return;
  state.tab=t.dataset.tab; state.search=''; render();
});
document.getElementById('fab').onclick=()=>{
  const type = state.tab==='cmd' ? 'commande':'sav';
  openForm(type,null);
};

initDb();
setInterval(()=>render(), 60000);
setInterval(checkNotify, 5*60000);
</script>
